name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm_moveis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm_moveis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://crm:crm@localhost:5432/crm_moveis?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Aplicar migrations
        run: npx prisma migrate deploy

      - name: Testes unitários
        run: npm run test

      - name: Build
        run: npm run build

      - name: Build do Worker (Cloudflare)
        run: npm run cf:build
